<!-- HEAD:
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;500&display=swap">
-->
<div id="sp-root" class="sp-root">
  <canvas id="spectra-canvas" aria-label="Spectra render. Move the pointer to steer the light, drag to spin the logo."></canvas>

  <div class="sp-ui" id="sp-ui">
    <div class="sp-mark" aria-label="Spectra">
      <svg class="sp-mark-glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.6L13.9 13H2.1z"/></svg>
      <span>Spectra</span>
    </div>

    <p class="sp-hint" id="sp-hint" aria-hidden="true"><span class="sp-hint-fine">Move to steer the light · Drag to spin</span><span class="sp-hint-touch">Drag to spin · Tap to aim the light</span></p>

    <div class="sp-dock" id="sp-dock">
      <div class="sp-toast" id="sp-toast" role="status" aria-live="polite"></div>

      <!-- Logo popover -->
      <div class="sp-pop sp-pop--logo" id="sp-pop-logo" role="dialog" aria-label="Choose a logo" hidden>
        <button type="button" class="sp-drop" id="sp-pick">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5V3M5 6l3-3 3 3M3 10.5v1.75c0 .7.55 1.25 1.25 1.25h7.5c.7 0 1.25-.55 1.25-1.25V10.5"/></svg>
          <span class="sp-drop-t">Drop an SVG or PNG</span>
          <span class="sp-drop-s">or click to browse</span>
        </button>
        <form class="sp-word" id="sp-word" autocomplete="off">
          <input id="sp-word-in" type="text" maxlength="24" spellcheck="false" placeholder="or type a word" aria-label="Type a word to use as the prism" enterkeyhint="go">
          <kbd aria-hidden="true">↵</kbd>
        </form>
        <div class="sp-samples" id="sp-samples" role="group" aria-label="Sample marks"></div>
        <div class="sp-sliders" role="group" aria-label="Shape">
          <label class="sp-sl" for="sp-thick"><span class="sp-sl-t">Thickness</span><span class="sp-sl-v" id="sp-thick-v">50</span>
            <input id="sp-thick" type="range" min="0" max="100" step="1" value="50"></label>
          <label class="sp-sl" for="sp-round"><span class="sp-sl-t">Roundness</span><span class="sp-sl-v" id="sp-round-v">65</span>
            <input id="sp-round" type="range" min="0" max="100" step="1" value="65"></label>
        </div>
        <input id="sp-file" type="file" accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp" hidden>
      </div>

      <!-- Light popover -->
      <div class="sp-pop sp-pop--light" id="sp-pop-light" role="dialog" aria-label="Lighting" hidden>
        <p class="sp-pop-label">Light</p>
        <div class="sp-opts" role="radiogroup" aria-label="Light">
          <button type="button" class="sp-opt" role="radio" aria-checked="true" data-light="beam"><span class="sp-opt-ico sp-ico-beam" aria-hidden="true"></span><span class="sp-row-t">Beam</span></button>
          <button type="button" class="sp-opt" role="radio" aria-checked="false" data-light="studio"><span class="sp-opt-ico sp-ico-studio" aria-hidden="true"></span><span class="sp-row-t">Studio</span></button>
        </div>
        <p class="sp-pop-label">Source</p>
        <div class="sp-opts sp-opts--3" role="radiogroup" aria-label="Light source">
          <button type="button" class="sp-opt" role="radio" aria-checked="true" data-source="white" title="Equal-energy white light"><span class="sp-opt-ico sp-ico-src" aria-hidden="true"><i></i></span><span class="sp-row-t">White</span></button>
          <button type="button" class="sp-opt" role="radio" aria-checked="false" data-source="sun" title="Daylight (CIE D65)"><span class="sp-opt-ico sp-ico-src" aria-hidden="true"><i></i></span><span class="sp-row-t">Sun</span></button>
          <button type="button" class="sp-opt" role="radio" aria-checked="false" data-source="tungsten" title="Incandescent bulb, 2700 K"><span class="sp-opt-ico sp-ico-src" aria-hidden="true"><i></i></span><span class="sp-row-t">Tungsten</span></button>
          <button type="button" class="sp-opt" role="radio" aria-checked="false" data-source="neon" title="Neon emission lines"><span class="sp-opt-ico sp-ico-src" aria-hidden="true"><i></i></span><span class="sp-row-t">Neon</span></button>
          <button type="button" class="sp-opt" role="radio" aria-checked="false" data-source="sodium" title="Sodium D lines, 589 nm"><span class="sp-opt-ico sp-ico-src" aria-hidden="true"><i></i></span><span class="sp-row-t">Sodium</span></button>
          <button type="button" class="sp-opt" role="radio" aria-checked="false" data-source="mercury" title="Mercury emission lines"><span class="sp-opt-ico sp-ico-src" aria-hidden="true"><i></i></span><span class="sp-row-t">Mercury</span></button>
        </div>
        <p class="sp-pop-label">Background</p>
        <div class="sp-opts" role="radiogroup" aria-label="Background">
          <button type="button" class="sp-opt" role="radio" aria-checked="true" data-theme="dark"><span class="sp-opt-ico sp-ico-dark" aria-hidden="true"></span><span class="sp-row-t">Dark</span></button>
          <button type="button" class="sp-opt" role="radio" aria-checked="false" data-theme="light"><span class="sp-opt-ico sp-ico-light" aria-hidden="true"></span><span class="sp-row-t">Light</span></button>
        </div>
      </div>

      <!-- Export popover -->
      <div class="sp-pop sp-pop--export" id="sp-pop-export" role="dialog" aria-label="Export" hidden>
        <button type="button" class="sp-row" id="sp-xp-png">
          <span class="sp-row-t">PNG</span>
          <span class="sp-row-s" id="sp-xp-png-s">2×</span>
        </button>
        <div class="sp-row sp-row--video" id="sp-xp-mp4-wrap">
          <button type="button" class="sp-row-hit" id="sp-xp-mp4">
            <span class="sp-row-t">MP4 loop</span>
            <span class="sp-row-s" id="sp-xp-mp4-s">6 s</span>
          </button>
          <div class="sp-prog" id="sp-prog" hidden>
            <div class="sp-prog-top">
              <span class="sp-row-t" id="sp-prog-label">Rendering</span>
              <span class="sp-prog-pct" id="sp-prog-pct">0%</span>
              <button type="button" class="sp-cancel" id="sp-cancel">Cancel</button>
            </div>
            <div class="sp-prog-bar" role="progressbar" aria-label="Export progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="sp-prog-fill"></i></div>
          </div>
        </div>
        <div class="sp-xp-3d" id="sp-xp-3d" role="group" aria-label="3D model">
          <div class="sp-row sp-row--video" id="sp-xp-glb-wrap">
            <button type="button" class="sp-row-hit" id="sp-xp-glb" title="Shift-click for a finer mesh">
              <span class="sp-row-t">GLB</span>
              <span class="sp-row-s" id="sp-xp-glb-s">Blender · three.js</span>
            </button>
          </div>
          <div class="sp-row sp-row--video" id="sp-xp-stl-wrap">
            <button type="button" class="sp-row-hit" id="sp-xp-stl" title="Shift-click for a finer mesh">
              <span class="sp-row-t">STL</span>
              <span class="sp-row-s" id="sp-xp-stl-s">3D print</span>
            </button>
          </div>
        </div>
      </div>

      <div class="sp-pill" id="sp-pill" role="toolbar" aria-label="Spectra controls">
        <div class="sp-seg" id="sp-seg" role="radiogroup" aria-label="Material">
          <span class="sp-seg-ind" id="sp-seg-ind" aria-hidden="true"></span>
          <button type="button" role="radio" aria-checked="true" data-material="glass" aria-keyshortcuts="G">Glass</button>
          <button type="button" role="radio" aria-checked="false" data-material="chrome" aria-keyshortcuts="C">Chrome</button>
        </div>
        <span class="sp-div" aria-hidden="true"></span>
        <button type="button" class="sp-btn" id="sp-light" aria-haspopup="dialog" aria-expanded="false" aria-controls="sp-pop-light">Light</button>
        <button type="button" class="sp-btn" id="sp-logo" aria-haspopup="dialog" aria-expanded="false" aria-controls="sp-pop-logo">Logo</button>
        <button type="button" class="sp-btn" id="sp-export" aria-haspopup="dialog" aria-expanded="false" aria-controls="sp-pop-export">Export</button>
        <button type="button" class="sp-btn sp-btn--icon" id="sp-camera" aria-label="Camera" title="Camera (K)" aria-keyshortcuts="K" aria-expanded="false" aria-controls="sp-cam">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.25 5.75c0-.69.56-1.25 1.25-1.25h1.6l.95-1.5h3.9l.95 1.5h1.6c.69 0 1.25.56 1.25 1.25v5.5c0 .69-.56 1.25-1.25 1.25h-9c-.69 0-1.25-.56-1.25-1.25z"/><circle cx="8" cy="8.4" r="2.2"/></svg>
        </button>
      </div>
    </div>
    <!-- Camera mode (src/camera.js). Camera UX adapted from 3dsvg by Renato Costa, MIT. -->
    <div class="sp-cam" id="sp-cam" hidden>
      <div class="sp-vf" id="sp-vf" aria-hidden="true">
        <i class="sp-vf-c sp-vf-c--tl"></i><i class="sp-vf-c sp-vf-c--tr"></i><i class="sp-vf-c sp-vf-c--bl"></i><i class="sp-vf-c sp-vf-c--br"></i>
        <span class="sp-vf-size" id="sp-vf-size"></span>
        <img class="sp-vf-media" id="sp-vf-img" alt="" hidden>
        <video class="sp-vf-media" id="sp-vf-video" muted loop playsinline hidden></video>
        <span class="sp-vf-flash" id="sp-vf-flash"></span>
      </div>

      <div class="sp-cam-bar" id="sp-cam-bar" role="group" aria-label="Camera">
        <div class="sp-cam-opts">
          <div class="sp-cam-aspect" id="sp-cam-aspect" role="radiogroup" aria-label="Aspect ratio">
            <button type="button" role="radio" data-aspect="free" aria-checked="true">Free</button>
            <button type="button" role="radio" data-aspect="1:1" aria-checked="false">1:1</button>
            <button type="button" role="radio" data-aspect="4:5" aria-checked="false">4:5</button>
            <button type="button" role="radio" data-aspect="9:16" aria-checked="false">9:16</button>
            <button type="button" role="radio" data-aspect="16:9" aria-checked="false">16:9</button>
          </div>
          <span class="sp-div" aria-hidden="true"></span>
          <button type="button" class="sp-cam-res" id="sp-cam-res" aria-label="Resolution 1080p">1080p</button>
        </div>
        <div class="sp-cam-modes" id="sp-cam-modes" role="radiogroup" aria-label="Capture mode">
          <button type="button" role="radio" data-mode="photo" aria-checked="true">Photo</button>
          <button type="button" role="radio" data-mode="video" aria-checked="false">Video</button>
          <button type="button" role="radio" data-mode="loop" aria-checked="false">Loop</button>
        </div>
        <div class="sp-cam-row">
          <button type="button" class="sp-cam-round" id="sp-cam-close" aria-label="Close camera" title="Close (Esc)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
          </button>
          <button type="button" class="sp-shutter" id="sp-shutter" data-mode="photo" aria-label="Take photo"><span class="sp-shutter-core"></span></button>
          <button type="button" class="sp-cam-round" id="sp-cam-clear" aria-pressed="false" aria-label="Transparent background" title="Transparent background">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2"/><path class="f" d="M3 5a2 2 0 0 1 2-2h3v5H3zM8 8h5v3a2 2 0 0 1-2 2H8z"/></svg>
          </button>
        </div>
        <p class="sp-cam-note" id="sp-cam-note"></p>
      </div>

      <div class="sp-cam-pill sp-cam-rec" id="sp-cam-rec" role="group" aria-label="Recording" hidden>
        <span class="sp-rec-dot" aria-hidden="true"></span>
        <span class="sp-rec-time" id="sp-rec-time" role="timer" aria-label="Recording time">0:00.0</span>
        <button type="button" class="sp-rec-stop" id="sp-rec-stop"><i aria-hidden="true"></i>Stop</button>
      </div>

      <div class="sp-cam-pill sp-cam-busy" id="sp-cam-busy" role="group" aria-label="Rendering" hidden>
        <div class="sp-prog">
          <div class="sp-prog-top">
            <span class="sp-row-t" id="sp-busy-label">Rendering</span>
            <span class="sp-prog-pct" id="sp-busy-pct">0%</span>
            <button type="button" class="sp-cancel" id="sp-busy-cancel">Cancel</button>
          </div>
          <div class="sp-prog-bar" role="progressbar" aria-label="Render progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="sp-busy-fill"></i></div>
        </div>
      </div>

      <div class="sp-sheet" id="sp-sheet" role="dialog" aria-label="Preview" aria-describedby="sp-sheet-meta" hidden>
        <div class="sp-sheet-head">
          <span class="sp-row-t" id="sp-sheet-title">Photo</span>
          <span class="sp-row-s" id="sp-sheet-meta"></span>
        </div>
        <div class="sp-trim" id="sp-trim" hidden>
          <div class="sp-trim-main">
            <button type="button" class="sp-trim-play" id="sp-trim-play" aria-label="Pause">
              <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4v8M10.5 4v8"/></svg>
              <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.8l6.5 4.2-6.5 4.2z"/></svg>
            </button>
            <div class="sp-trim-strip" id="sp-trim-strip">
              <canvas class="sp-trim-film" id="sp-trim-film" aria-hidden="true"></canvas>
              <i class="sp-trim-dim" id="sp-trim-dim-l"></i><i class="sp-trim-dim" id="sp-trim-dim-r"></i>
              <i class="sp-trim-sel" id="sp-trim-sel"></i>
              <i class="sp-trim-head" id="sp-trim-head"></i>
              <span class="sp-trim-h sp-trim-h--s" id="sp-trim-hs" role="slider" tabindex="0" aria-label="Trim start" data-handle="start"><svg viewBox="0 0 6 16" aria-hidden="true"><path d="M4 3L2 8l2 5"/></svg></span>
              <span class="sp-trim-h sp-trim-h--e" id="sp-trim-he" role="slider" tabindex="0" aria-label="Trim end" data-handle="end"><svg viewBox="0 0 6 16" aria-hidden="true"><path d="M2 3l2 5-2 5"/></svg></span>
            </div>
          </div>
          <div class="sp-trim-times" aria-hidden="true"><span id="sp-trim-t0">0.0s</span><span id="sp-trim-len">0.0s</span><span id="sp-trim-t1">0.0s</span></div>
        </div>
        <div class="sp-sheet-opts" id="sp-sheet-opts" hidden>
          <div class="sp-cam-fps" id="sp-cam-fps" role="radiogroup" aria-label="Frame rate">
            <button type="button" role="radio" data-fps="30" aria-checked="false">30 fps</button>
            <button type="button" role="radio" data-fps="60" aria-checked="true">60 fps</button>
          </div>
          <p class="sp-sheet-note" id="sp-sheet-note">Rendered offline, frame by frame: smooth even if the live view stuttered.</p>
        </div>
        <div class="sp-sheet-prog" id="sp-sheet-prog" hidden>
          <div class="sp-prog">
            <div class="sp-prog-top">
              <span class="sp-row-t" id="sp-sheet-prog-label">Rendering</span>
              <span class="sp-prog-pct" id="sp-sheet-prog-pct">0%</span>
              <button type="button" class="sp-cancel" id="sp-sheet-cancel">Cancel</button>
            </div>
            <div class="sp-prog-bar" role="progressbar" aria-label="Render progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="sp-sheet-prog-fill"></i></div>
          </div>
        </div>
        <div class="sp-sheet-actions" id="sp-sheet-actions">
          <button type="button" class="sp-sbtn" id="sp-retake">Retake</button>
          <button type="button" class="sp-sbtn sp-sbtn--primary" id="sp-dl">Download</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sp-dropzone" id="sp-dropzone" aria-hidden="true"><span>Drop to use as your prism</span></div>
</div>
